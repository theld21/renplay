name: Flake hunt

on:
  workflow_dispatch:
    inputs:
      repeats:
        description: Runs of each test, without retries
        type: number
        default: 10
        required: true
  schedule:
    - cron: '17 2 * * *'

permissions: {}

concurrency:
  group: flake-hunt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repeat:
    name: Flake hunt (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        suite: [legacy, playwright]
    env:
      UI_REPEAT: ${{ github.event_name == 'schedule' && 10 || inputs.repeats }}
      UI_TIMEOUT: '3000'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.ref }}
          persist-credentials: false
      - name: Repeat every test without retries
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          if ! [[ "$UI_REPEAT" =~ ^[1-9][0-9]*$ ]]; then
            echo 'The repeat count must be a positive integer.'
            exit 1
          fi
          # UI_REPEAT maps to --repeat-each and --retries=0 for Playwright.
          # The older runner keeps going after a failed run and retains each run's log.
          sh scripts/test-ui.sh "$SUITE"
      - name: Every test that failed at least once
        if: always()
        run: |
          echo '# Flake hunt' >> "$GITHUB_STEP_SUMMARY"
          echo "Requested runs of each test: $UI_REPEAT. No retries." >> "$GITHUB_STEP_SUMMARY"
          for file in ui-test-results/*-summary.md ui-test-results/*time.txt; do
            [ ! -f "$file" ] || cat "$file" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Reports and failure traces (mock data only)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flake-hunt-${{ matrix.suite }}
          path: ui-test-results/
          retention-days: 7
