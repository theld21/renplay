name: CI

# Every pull request into dev or main. Merging needs these checks green (the rulesets require them).
# Pushes run nothing here: dev only receives what a pull request already tested, and main only
# receives releases (release.yml).

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Pull requests into main are releases: from a release-X.Y.Z branch, with the versions and a dated
  # CHANGELOG.md section for X.Y.Z.
  release-check:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Versions and changelog
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          V="${BRANCH#release-}"
          if ! echo "$V" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Releases come from release-X.Y.Z branches, not $BRANCH"
            exit 1
          fi
          node scripts/release.mjs check "$V"

  # The code, the docs, the chart, the workflows and the deploy/ examples: the mise tasks
  # (tasks.toml) people run locally.
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.4
          # The tools by their versions alone (mise.toml), so editing a task (tasks.toml) keeps the
          # cache. Without it every tool comes from GitHub releases, which can fail for hours.
          cache_key: "{{cache_key_prefix}}-{{platform}}-{{version}}-${{ hashFiles('mise.toml') }}"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('server/package-lock.json', 'selector/package-lock.json', 'docs/site/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - run: mise run install
      - run: mise run check:server
      - run: mise run check:structure
      - run: mise run check:runtime
      - run: mise run check:copy
      - run: mise run check:ui
      - run: mise run check:docs
      - run: mise run check:website
      - run: mise run check:chart
      - run: mise run check:workflows
      - run: mise run check:examples

  browser-checks:
    name: Browser (${{ matrix.suite }})
    needs: changes
    if: needs.changes.outputs.browser-suites != '[]'
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.changes.outputs.browser-suites) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Browser checks
        env:
          SUITE: ${{ matrix.suite }}
        run: sh scripts/test-ui.sh "$SUITE"
      - name: Browser summary
        if: always()
        run: |
          for file in ui-test-results/*-summary.md ui-test-results/*time.txt; do
            [ ! -f "$file" ] || cat "$file" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Failure reports and traces (mock data only)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-${{ matrix.suite }}-evidence
          path: ui-test-results/
          retention-days: 7

  # Like Install contract, this name reports even when every browser job is skipped.
  browser:
    name: Browser suite
    needs: [changes, browser-checks]
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          BROWSER: ${{ needs.browser-checks.result }}
          SUITES: ${{ needs.changes.outputs.browser-suites }}
        run: |
          [ "$CHANGES" = success ] || { echo "Could not tell what changed: $CHANGES"; exit 1; }
          if [ "$SUITES" = '[]' ] && [ "$BROWSER" = skipped ]; then
            echo "No browser inputs changed." | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$SUITES" != '[]' ] && [ "$BROWSER" = success ]; then
            echo "All selected browser checks passed: $SUITES" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Browser checks failed: $BROWSER" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  # The telemetry collector (telemetry/): its types, its tests on a local D1 and a dry run of its deploy.
  telemetry:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.4
          install_args: node
          cache_key: "{{cache_key_prefix}}-{{platform}}-{{version}}-${{ hashFiles('mise.toml') }}"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-telemetry-${{ runner.os }}-${{ hashFiles('telemetry/package-lock.json') }}
          restore-keys: npm-telemetry-${{ runner.os }}-

      - run: mise run check:telemetry

  # Select only jobs whose inputs changed. Shared browser tooling always selects all suites.
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      image: ${{ steps.files.outputs.image }}
      browser-suites: ${{ steps.files.outputs.browser-suites }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR" ]; then
            echo "image=true" >> "$GITHUB_OUTPUT"
            echo 'browser-suites=["legacy","playwright","layout"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)' > files.txt
          echo "browser-suites=$(node scripts/browser-suites.mjs < files.txt)" >> "$GITHUB_OUTPUT"
          if grep -qE '^(server/|selector/|runtime/|image/|charts/|tests/|deploy/compose\.yaml$|Dockerfile$|\.dockerignore$|mise\.toml$|tasks\.toml$|\.github/workflows/ci\.yml$)' files.txt; then
            echo "image=true" >> "$GITHUB_OUTPUT"
          else
            echo "image=false" >> "$GITHUB_OUTPUT"
            echo "Nothing in the image or the chart changed, so the install contract is skipped."
          fi

  # The image, built from the cache earlier runs filled, against the install contract on both
  # architectures, and the chart installed on kind with it.
  contract:
    name: Install contract (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.image == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The cache is written by pull requests from this repository. Dependabot's have a read-only
      # token, so writing is allowed to fail.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: |
            renplay:contract
            ghcr.io/renplay-org/renplay:chart-test
          cache-from: type=registry,ref=ghcr.io/renplay-org/renplay-cache:${{ matrix.arch }}
          cache-to: type=registry,ref=ghcr.io/renplay-org/renplay-cache:${{ matrix.arch }},mode=max,ignore-error=true

      - name: User IDs and read-only root filesystem
        run: python3 tests/contract.py renplay:contract users
      - name: Native Ren'Py install and game HTTP smoke test
        run: python3 tests/contract.py renplay:contract smoke
      - name: Upgrade from the newest release, back to it and up again
        run: python3 tests/contract.py renplay:contract upgrade
      - name: Separate downloads mount
        run: python3 tests/contract.py renplay:contract smoke --downloads

      - name: deploy/compose.yaml starts the image
        if: matrix.arch == 'amd64'
        run: sh tests/compose.sh renplay:contract

      - if: matrix.arch == 'amd64'
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.4
          install_args: helm
          # This job writes the image build cache: nothing in it comes from a cache it could not trust.
          cache: false

      # kind comes with the runner image. The chart's own test pod checks the service answers.
      - name: The chart on kind
        if: matrix.arch == 'amd64'
        run: |
          kind version
          kind create cluster --name chart --wait 120s
          kind load docker-image ghcr.io/renplay-org/renplay:chart-test --name chart
          helm install renplay charts/renplay --namespace renplay --create-namespace \
            --set image.tag=chart-test --set image.pullPolicy=Never --wait --timeout 5m
          helm test renplay --namespace renplay --timeout 5m

  # The check the rulesets require: the contract passed on both architectures, or nothing it
  # covers changed. (A skipped matrix job reports under its unexpanded name.)
  contract-result:
    name: Install contract
    needs: [changes, contract]
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          CONTRACT: ${{ needs.contract.result }}
        run: |
          [ "$CHANGES" = success ] || { echo "Could not tell what changed: $CHANGES"; exit 1; }
          case "$CONTRACT" in
            success) echo "The install contract passed." ;;
            skipped) echo "Nothing in the image or the chart changed." ;;
            *) echo "The install contract failed: $CONTRACT"; exit 1 ;;
          esac
