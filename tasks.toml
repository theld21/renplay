# Every task for working on Renplay (mise.toml includes this file). `mise tasks` lists them.

# ---- setup and development --------------------------------------------------------------------

[install]
description = "Install the npm packages of the server, the library and the docs, and the pre-push hook"
run = ["npm ci --prefix server", "npm ci --prefix selector", "npm ci --prefix docs/site", "git rev-parse --git-dir >/dev/null 2>&1 && git config core.hooksPath .githooks || true"]

[dev]
description = "The server and the library together: open http://localhost:5199"
depends = ["dev:server", "dev:ui"]

["dev:server"]
description = "The server on port 3999, with its games and data in /tmp/rp"
dir = "server"
env = { DATA_DIR = "/tmp/rp/data", GAMES_DIR = "/tmp/rp/games", PORT = "3999" }
run = ["npx tsc -p .", "node dist/index.js"]

["dev:ui"]
description = "The library on http://localhost:5199, against the server on port 3999 (or RENPLAY_BACKEND)"
dir = "selector"
run = "npm run dev"

[docs]
description = "The docs on http://localhost:4321"
dir = "docs/site"
run = "npm run dev"

[website]
description = "The website on http://localhost:5190 (its _redirects work only on Cloudflare)"
run = ["sh website/build.sh", "python -m http.server --directory website/dist 5190"]

[test]
description = "The server's tests"
dir = "server"
run = "npx vitest run"

["test:ui"]
description = "The complete browser suite in the pinned Linux container (Docker required)"
run = "sh scripts/test-ui.sh"

["test:ui:stop"]
description = "Remove this worktree's warm browser container"
run = "sh scripts/test-ui.sh --stop"

[screenshots]
description = "Phone and desktop screenshots of a running Renplay: mise run screenshots <url> <dir> [--sfw]"
dir = "server"
run = "npm run screenshots --"

# ---- checks (CI runs each of these) -----------------------------------------------------------

[check]
description = "Everything CI checks, except the image"
depends = ["check:server", "check:structure", "check:runtime", "check:copy", "check:ui", "test:ui", "check:docs", "check:website", "check:chart", "check:workflows", "check:examples", "check:telemetry"]

["check:server"]
description = "Server type check, the tests' type check, and the tests"
dir = "server"
# Vitest runs the tests without checking their types: tsconfig.test.json does.
run = ["npx tsc --noEmit", "npx tsc -p tsconfig.test.json", "npx vitest run"]

["check:structure"]
description = "No import cycles, layers in order, no unused exports, files within the size budget"
run = "node scripts/check-structure.mjs"

["check:types"]
description = "Type checks of the server, its tests and the library"
run = ["cd server && npx tsc --noEmit && npx tsc -p tsconfig.test.json", "cd selector && npx tsc -b --noEmit"]

["check:fast"]
description = "What the pre-push hook runs: types, structure, the runtimes and the writing rule"
depends = ["check:types", "check:structure", "check:runtime", "check:copy"]

["check:runtime"]
description = "The game runtimes parse"
run = ["node --check runtime/renplay-player.js", "node --check runtime/renplay-runtime.js", "node --check runtime/renplay-html.js"]

["check:copy"]
description = "The writing rule in the interface, server messages, changelog and docs"
run = "node scripts/check-copy.mjs --docs"

["check:ui"]
description = "Library type check and build"
dir = "selector"
run = ["npx tsc -b --noEmit", "npm run build", "node ../scripts/check-dist.mjs"]

["check:app-ui"]
description = "The library in a browser, files in server/scripts/app-ui (run a few at a time, each also on its own): whole rows, scroll memory, the artwork's flight, layout shift, the Up next carousel, the search and its scrolling, the flight to a game's page"
run = "sh scripts/test-ui.sh legacy"

["check:docs"]
description = "Docs build, with the configuration page and every link checked"
dir = "docs/site"
run = ["npm run check:config", "npm run build"]

["check:website"]
description = "Website build, with every local link and picture checked"
run = ["sh website/build.sh", "node scripts/check-website.mjs"]

["check:layout"]
description = "No page of the website or the docs shifts by more than 0.02 while it loads and scrolls (Cumulative Layout Shift, at 390 px in WebKit and 1440 px in Chromium)"
run = "sh scripts/test-ui.sh layout"

["check:chart"]
description = "Chart lint and tests, and its values reference up to date"
run = [
  "python -m pip install --quiet PyYAML==6.0.2",
  "helm lint charts/renplay --strict",
  "python tests/chart.py",
  "python tests/chart-metadata.py",
  "helm-docs --chart-search-root charts/renplay",
  "git diff --exit-code -- charts/renplay/README.md",
]

["check:workflows"]
description = "GitHub workflows: actionlint and zizmor"
run = ["node --test scripts/browser-suites.test.mjs scripts/ui-workspace.test.mjs", "actionlint", "zizmor --persona regular --min-severity medium .github/workflows"]

["check:telemetry"]
description = "The telemetry collector: type check, tests on a local D1, and a dry run of the deploy"
dir = "telemetry"
run = ["npm ci", "npx tsc --noEmit", "npx vitest run", "npx wrangler deploy --dry-run --outdir /tmp/renplay-telemetry-dry"]

["check:examples"]
description = "The files people copy from deploy/ are valid (needs Docker)"
run = "sh tests/examples.sh"

# ---- image ------------------------------------------------------------------------------------

[image]
description = "Build the image as renplay:dev"
run = "docker build -t renplay:dev ."

[contract]
description = "The image's install contract, and deploy/compose.yaml starting it (needs Docker)"
depends = ["image"]
run = ["python tests/contract.py renplay:dev all", "sh tests/compose.sh renplay:dev"]

[demo]
description = "The demo's image (demo/README.md) from a released version"
usage = 'arg "<version>" help="The Renplay release to build from, like 4.4.0"'
run = "sh demo/build-games.sh 8.5.3 demo/games && docker build --build-arg IMAGE=ghcr.io/renplay-org/renplay:${usage_version} -t renplay-demo demo"

# ---- releases ---------------------------------------------------------------------------------

[release]
description = "Prepare a release branch: mise run release <X.Y.Z> (see .agents/skills/release)"
run = "node scripts/release.mjs"
